---
# file: site.yml

- name: Scrutiny hub (InfluxDB + web UI/API)
  hosts: scrutiny_web
  become: true
  roles:
    - role: preflight
      tags: [always]
    - role: influxdb
      when: scrutiny_influxdb_install | bool
      tags: [influxdb]
    - role: webapp
      tags: [webapp]

- name: Scrutiny collectors
  hosts: scrutiny_collector
  become: true
  roles:
    - role: preflight
      tags: [always]
    - role: collector
      tags: [collector]

  post_tasks:
    - name: Success!
      ansible.builtin.debug:
        msg:
          - "If you're reading this, Scrutiny has been successfully deployed."
          - "Dashboard: {{ scrutiny_collector_api_endpoint }}"
      when: inventory_hostname == ansible_play_hosts[0]
