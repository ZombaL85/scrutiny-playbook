---
name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly, to notice when a distro or upstream repo changes under us
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install "ansible-core==2.21.5" "ansible-lint==26.10.1"
      - name: Check that committed vault files are encrypted
        run: |
          status=0
          for f in $(git ls-files '*vault.yml' '*vault.yaml' '*/vault/*'); do
            head -n1 "$f" | grep -q '^\$ANSIBLE_VAULT;' \
              || { echo "::error file=$f::$f is not encrypted with ansible-vault"; status=1; }
          done
          exit $status
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check
        run: ansible-playbook --syntax-check -i tests/inventory site.yml

  test:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian12
          - debian13
          - ubuntu2204
          - ubuntu2404
          - ubuntu2604
          - rockylinux10
    name: test (${{ matrix.distro }})
    env:
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install "ansible-core==2.21.5"
          ansible-galaxy collection install "community.docker:==4.8.9"
          ansible --version

      - name: Start systemd container
        run: |
          docker run --detach --name test --hostname test \
            --privileged --cgroupns=host \
            --volume=/sys/fs/cgroup:/sys/fs/cgroup:rw \
            "geerlingguy/docker-${{ matrix.distro }}-ansible:latest"
          for i in $(seq 1 30); do
            state=$(docker exec test systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done
          echo "systemd state: ${state:-unknown}"

      - name: Drop the vault (CI has no vault password; tests/ci-vars.yml covers it)
        run: rm -f group_vars/all/vault.yml

      - name: Run playbook
        run: |
          set -o pipefail
          ansible-playbook -i tests/inventory site.yml -e @tests/ci-vars.yml | tee /tmp/first-run.log

      - name: Idempotence check
        run: |
          set -o pipefail
          ansible-playbook -i tests/inventory site.yml -e @tests/ci-vars.yml | tee /tmp/second-run.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' /tmp/second-run.log \
            || { echo "::error::Second run reported changes - playbook is not idempotent"; exit 1; }

      - name: Smoke test
        run: |
          ansible -i tests/inventory test -m ansible.builtin.uri -a "url=http://127.0.0.1:8080/api/health"
          docker exec test systemctl is-enabled scrutiny-collector.timer

      - name: Report Ansible errors as annotations
        if: failure()
        run: >
          python3 tests/annotate_errors.py "${{ matrix.distro }}"
          /tmp/first-run.log /tmp/second-run.log

      - name: Service logs
        if: failure()
        run: |
          docker exec test journalctl -u influxdb -u scrutiny-web --no-pager -n 100 || true
          docker exec test sh -c 'cat /etc/os-release; rpm -q rpm gnupg2 curl 2>/dev/null || dpkg -l rpm gnupg curl 2>/dev/null | tail -3' || true
