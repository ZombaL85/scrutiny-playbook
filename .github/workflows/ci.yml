---
name: CI

on:
  push:
  pull_request:
  schedule:
    # weekly, to notice when a distro or upstream repo changes under us
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install linters
        run: pip install "ansible-core==2.21.5" "ansible-lint==26.10.1"
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check
        run: ansible-playbook --syntax-check -i tests/inventory site.yml

  test:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The playbook runs on the runner (controller) with a pinned
        # ansible-core, not with whatever Ansible the test image ships.
        # EL8 targets only have Python 3.6, which ansible-core 2.17+ dropped.
        include:
          - {distro: debian12, ansible_core: "2.21.5"}
          - {distro: debian13, ansible_core: "2.21.5"}
          - {distro: ubuntu2204, ansible_core: "2.21.5"}
          - {distro: ubuntu2404, ansible_core: "2.21.5"}
          - {distro: ubuntu2604, ansible_core: "2.21.5"}
          - {distro: rockylinux8, ansible_core: "2.16.19"}
          - {distro: rockylinux9, ansible_core: "2.21.5"}
          - {distro: rockylinux10, ansible_core: "2.21.5"}
    name: test (${{ matrix.distro }}, ansible-core ${{ matrix.ansible_core }})
    env:
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          pip install "ansible-core==${{ matrix.ansible_core }}"
          # 4.8.x is the last series that still supports ansible-core 2.16
          ansible-galaxy collection install "community.docker:==4.8.9"
          ansible --version

      - name: Start systemd container
        run: |
          docker run --detach --name test --hostname test \
            --privileged --cgroupns=host \
            --volume=/sys/fs/cgroup:/sys/fs/cgroup:rw \
            "geerlingguy/docker-${{ matrix.distro }}-ansible:latest"
          for i in $(seq 1 30); do
            state=$(docker exec test systemctl is-system-running 2>/dev/null || true)
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done
          echo "systemd state: ${state:-unknown}"

      - name: Run playbook
        run: ansible-playbook -i tests/inventory site.yml -e @tests/ci-vars.yml

      - name: Idempotence check
        run: |
          ansible-playbook -i tests/inventory site.yml -e @tests/ci-vars.yml | tee /tmp/second-run.log
          grep -qE 'changed=0 +unreachable=0 +failed=0' /tmp/second-run.log \
            || { echo "::error::Second run reported changes - playbook is not idempotent"; exit 1; }

      - name: Smoke test
        run: |
          ansible -i tests/inventory test -m ansible.builtin.uri -a "url=http://127.0.0.1:8080/api/health"
          docker exec test systemctl is-enabled scrutiny-collector.timer

      - name: Service logs
        if: failure()
        run: docker exec test journalctl -u influxdb -u scrutiny-web --no-pager -n 100 || true
