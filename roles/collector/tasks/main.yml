---
# I pick things up / I am a collector
# And things, well things / They tend to accumulate

- name: Preflight | Check architecture
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in scrutiny_arch_map
    fail_msg: "Unsupported architecture: {{ ansible_facts['architecture'] }}"
    quiet: true

- name: Preflight | Check that checksums exist for this version
  ansible.builtin.assert:
    that: scrutiny_version in scrutiny_checksums
    fail_msg: "Add SHA256 digests for {{ scrutiny_version }} to scrutiny_checksums in group_vars/all/main.yml"
    quiet: true

- name: Set architecture-specific asset name
  ansible.builtin.set_fact:
    scrutiny_collector_asset: "scrutiny-collector-metrics-linux-{{ scrutiny_arch_map[ansible_facts['architecture']] }}"

# smartctl 7+ is in the base repos of every currently supported distro
- name: Software - Install smartmontools
  ansible.builtin.package:
    name: smartmontools
    state: present

- name: Preflight | Check Healthchecks settings
  ansible.builtin.assert:
    that:
      - scrutiny_healthchecks_ping_key is defined
      - scrutiny_healthchecks_ping_key | length > 0
      - scrutiny_healthchecks_slug is match('^[a-z0-9_-]+$')
    fail_msg: >-
      With scrutiny_healthchecks_enabled define scrutiny_healthchecks_ping_key
      (in the vault) and a slug made of lowercase letters, digits, "-" and "_".
    quiet: true
  no_log: true
  when: scrutiny_healthchecks_enabled | bool

- name: Binary - Install the collector binary
  ansible.builtin.get_url:
    url: "{{ scrutiny_download_base }}/{{ scrutiny_collector_asset }}"
    dest: "{{ scrutiny_collector_bin }}"
    checksum: "sha256:{{ scrutiny_checksums[scrutiny_version][scrutiny_collector_asset] }}"
    owner: root
    group: root
    mode: "0755"
    timeout: 60
  register: scrutiny_collector_binary

# Healthchecks
- name: Healthchecks - Install curl
  ansible.builtin.package:
    name: curl
    state: present
  when: scrutiny_healthchecks_enabled | bool

- name: Healthchecks - Create the configuration directory
  ansible.builtin.file:
    path: /etc/scrutiny
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: scrutiny_healthchecks_enabled | bool

- name: Healthchecks - Install the ping URL (contains the ping key)
  ansible.builtin.template:
    src: scrutiny-healthcheck.env.j2
    dest: /etc/scrutiny/healthcheck.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: scrutiny_healthchecks_enabled | bool

- name: Healthchecks - Install the ping helper
  ansible.builtin.copy:
    src: scrutiny-healthcheck-ping
    dest: /usr/local/sbin/scrutiny-healthcheck-ping
    owner: root
    group: root
    mode: "0755"
  when: scrutiny_healthchecks_enabled | bool

# Check management through the API runs from the control node.
- name: Healthchecks - Read the host time zone
  ansible.builtin.command:
    cmd: timedatectl show --property=Timezone --value
  register: scrutiny_host_tz
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - scrutiny_healthchecks_enabled | bool
    - scrutiny_healthchecks_api_key | default('') | length > 0
    - scrutiny_healthchecks_tz | length == 0

- name: Healthchecks - Set the desired check settings
  ansible.builtin.set_fact:
    scrutiny_healthchecks_desired:
      schedule: "{{ scrutiny_healthchecks_schedule }}"
      tz: >-
        {{ scrutiny_healthchecks_tz if scrutiny_healthchecks_tz | length > 0
           else (scrutiny_host_tz.stdout | default('') | trim or 'UTC') }}
      grace: "{{ scrutiny_healthchecks_grace | int }}"
  when:
    - scrutiny_healthchecks_enabled | bool
    - scrutiny_healthchecks_api_key | default('') | length > 0

- name: Healthchecks - Look up the check
  ansible.builtin.uri:
    url: "{{ scrutiny_healthchecks_api_url | regex_replace('/+$', '') }}/checks/?slug={{ scrutiny_healthchecks_slug }}"
    headers:
      X-Api-Key: "{{ scrutiny_healthchecks_api_key }}"
    timeout: 15
  register: scrutiny_healthchecks_lookup
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true
  when: scrutiny_healthchecks_desired is defined

# Read-only keys can list checks (without update_url) but get 401 on writes.
- name: Healthchecks - Check that the API key is not read-only
  ansible.builtin.assert:
    that: >-
      scrutiny_healthchecks_lookup.json.checks | length == 0
      or 'update_url' in scrutiny_healthchecks_lookup.json.checks | first
    fail_msg: >-
      scrutiny_healthchecks_api_key is a read-only key. Use a read-write project
      API key (Project Settings -> API Access).
    quiet: true
  when: scrutiny_healthchecks_desired is defined

- name: Healthchecks - Compare the check with the desired settings
  ansible.builtin.set_fact:
    # Only the managed fields; {} when the check does not exist yet.
    scrutiny_healthchecks_current: >-
      {{ scrutiny_healthchecks_lookup.json.checks | first | default({})
         | dict2items | selectattr('key', 'in', ['schedule', 'tz', 'grace']) | items2dict }}
  when: scrutiny_healthchecks_desired is defined

- name: Healthchecks - Show the pending check change
  ansible.builtin.debug:
    msg:
      check: "{{ scrutiny_healthchecks_slug }}"
      current: "{{ scrutiny_healthchecks_current }}"
      desired: "{{ scrutiny_healthchecks_desired }}"
  when:
    - scrutiny_healthchecks_desired is defined
    - scrutiny_healthchecks_current != scrutiny_healthchecks_desired

# "unique: [slug]" updates an existing check instead of creating a duplicate.
# A new check gets all of the project's integrations, like one created by a ping.
- name: Healthchecks - Create or update the check
  ansible.builtin.uri:
    url: "{{ scrutiny_healthchecks_api_url | regex_replace('/+$', '') }}/checks/"
    method: POST
    headers:
      X-Api-Key: "{{ scrutiny_healthchecks_api_key }}"
    body_format: json
    body: >-
      {{ scrutiny_healthchecks_desired
         | combine({'slug': scrutiny_healthchecks_slug, 'unique': ['slug']})
         | combine({'name': scrutiny_healthchecks_slug, 'channels': '*'} if not scrutiny_healthchecks_current else {}) }}
    status_code: [200, 201]
    timeout: 15
  changed_when: true
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - scrutiny_healthchecks_desired is defined
    - scrutiny_healthchecks_current != scrutiny_healthchecks_desired

- name: Healthchecks - Remove files when disabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/scrutiny/healthcheck.env
    - /usr/local/sbin/scrutiny-healthcheck-ping
  when: not (scrutiny_healthchecks_enabled | bool)

- name: Systemd - Create collector service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - scrutiny-collector.service
    - scrutiny-collector.timer
  register: scrutiny_collector_units
  notify: Reload systemd

- name: Systemd - Apply unit changes
  ansible.builtin.meta: flush_handlers

# In check mode new/changed units are not written yet, so systemd cannot find them.
- name: Systemd - Enable and start the collector timer
  ansible.builtin.systemd_service:
    name: scrutiny-collector.timer
    enabled: true
    state: started
  when: not (ansible_check_mode and scrutiny_collector_units is changed)

# Clean-up after older versions of this playbook (cron-based)
- name: Cleanup - Check whether crontab is available
  ansible.builtin.stat:
    path: /usr/bin/crontab
  register: scrutiny_crontab_bin

# Read the crontab first: the cron module fails on an empty crontab with
# implementations that exit 2 instead of 1 (e.g. systemd-cron 2.x on Ubuntu 24.04).
- name: Cleanup - Read root's crontab
  ansible.builtin.command:
    cmd: crontab -l -u root
  register: scrutiny_root_crontab
  changed_when: false
  failed_when: false
  when: scrutiny_crontab_bin.stat.exists

- name: Cleanup - Remove the legacy cron entry
  ansible.builtin.cron:
    name: "Scrutiny - Run the Collector"
    user: root
    state: absent
  when:
    - scrutiny_crontab_bin.stat.exists
    - "'#Ansible: Scrutiny - Run the Collector' in scrutiny_root_crontab.stdout"

- name: Cleanup - Remove the legacy collector binary
  ansible.builtin.file:
    path: "{{ scrutiny_install_dir }}/bin/scrutiny-collector-metrics-linux"
    state: absent

- name: Run - Collect metrics once after install/upgrade
  ansible.builtin.systemd_service:
    name: scrutiny-collector.service
    state: started
  when:
    - scrutiny_collector_run_after_install | bool
    - scrutiny_collector_binary is changed
