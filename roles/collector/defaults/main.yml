---
scrutiny_collector_bin: /usr/local/bin/scrutiny-collector-metrics

# Address of the hub. Uses ansible_host of the first scrutiny_web host if set.
scrutiny_collector_api_endpoint: >-
  http://{{ hostvars[groups['scrutiny_web'][0]]['ansible_host'] | default(groups['scrutiny_web'][0]) }}:{{ scrutiny_web_port }}

# Label used to group this machine's drives in the dashboard ("" = none).
scrutiny_collector_host_id: "{{ inventory_hostname }}"

# systemd OnCalendar expression. Scrutiny's downsampling assumes roughly
# daily collection - running it much more often bloats InfluxDB.
scrutiny_collector_schedule: "*-*-* 01:00:00"
scrutiny_collector_randomized_delay: 15min

# Run the collector once right after it is installed/upgraded,
# so the dashboard is populated without waiting for the timer.
scrutiny_collector_run_after_install: true

# Healthchecks (https://healthchecks.io, also self-hosted) monitoring of
# collector runs. Each run pings <base_url>/<ping_key>/<slug>/start and then
# /<exit status>, with the run's log as the body, so a failed or missing run
# raises an alert. Keep the ping key in the vault.
scrutiny_healthchecks_enabled: false
scrutiny_healthchecks_base_url: "https://hc-ping.com"
# scrutiny_healthchecks_ping_key: "<project ping key>"   # vault
# Slug: lowercase letters, digits, "-" and "_" only.
scrutiny_healthchecks_slug: "scrutiny_{{ ansible_facts['hostname'] | lower | regex_replace('[^a-z0-9_-]', '-') }}"
# Create the check automatically on the first ping if it does not exist.
scrutiny_healthchecks_auto_create: true

# Manage the check (schedule, grace, time zone) through the Healthchecks
# Management API. Enabled when scrutiny_healthchecks_api_key (a read-write
# project API key, Project Settings -> API Access) is set in the vault.
scrutiny_healthchecks_api_url: "https://healthchecks.io/api/v3"
# Cron expression in scrutiny_healthchecks_tz - keep it in line with
# scrutiny_collector_schedule (default: daily at 01:00).
scrutiny_healthchecks_schedule: "0 1 * * *"
# Seconds; must cover scrutiny_collector_randomized_delay plus the run time.
scrutiny_healthchecks_grace: 1800
# IANA time zone name; "" = the host's time zone (the timer runs in it).
scrutiny_healthchecks_tz: "Europe/Warsaw"
